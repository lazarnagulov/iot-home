<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IoT Home System{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-red { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-home text-3xl"></i>
                    <h1 class="text-2xl font-bold">IoT Home System</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="/" class="hover:text-blue-200">
                        <i class="fas fa-dashboard"></i> Dashboard
                    </a>
                    <a href="/grafana" class="hover:text-blue-200">
                        <i class="fas fa-chart-line"></i> Analytics
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
