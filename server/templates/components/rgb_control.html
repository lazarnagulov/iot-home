<div x-data="{ 
    r: 255, 
    g: 255, 
    b: 255, 
    on: false,
    loading: false 
}" x-init="
    fetch('/api/rgb/pi3/status')
        .then(r => r.json())
        .then(data => {
            r = data.r || 255;
            g = data.g || 255;
            b = data.b || 255;
            on = data.on || false;
        })
        .catch(err => console.error('Failed to load RGB status'));
">
    <div class="mb-4 h-24 rounded-lg shadow-inner flex items-center justify-center transition-colors duration-300 border-4" 
         :style="`background-color: rgb(${r}, ${g}, ${b}); border-color: ${on ? 'rgb(' + r + ',' + g + ',' + b + ')' : '#e5e7eb'}`">
        <div class="text-center">
            <div class="text-white font-bold text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" 
                 x-text="on ? 'ON' : 'OFF'">
            </div>
            <div class="text-white text-xs drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] mt-1">
                RGB(<span x-text="r"></span>, <span x-text="g"></span>, <span x-text="b"></span>)
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4">
        <button 
            @click="toggleLight()"
            :disabled="loading"
            class="py-3 px-4 rounded-lg font-bold flex items-center justify-center transition-all hover:scale-105 active:scale-95 disabled:opacity-50"
            :class="on ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-green-500 hover:bg-green-600 text-white'">
            <i class="mr-2" :class="on ? 'fas fa-power-off' : 'fas fa-power-off'"></i>
            <span x-text="loading ? 'Wait...' : (on ? 'Turn OFF' : 'Turn ON')"></span>
        </button>
        
        <button 
            @click="setColor()"
            :disabled="loading || !on"
            class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-palette mr-2"></i>
            <span x-text="loading ? 'Wait...' : 'Apply Color'"></span>
        </button>
    </div>
    
    <div>
        <p class="text-sm font-bold text-gray-700 mb-2">Colors:</p>
        <div class="grid grid-cols-6 gap-2">
            <button @click="r=255; g=0; b=0; setColor()" 
                    class="h-10 bg-red-500 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Red" :disabled="!on"></button>
            <button @click="r=0; g=255; b=0; setColor()" 
                    class="h-10 bg-green-500 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Green" :disabled="!on"></button>
            <button @click="r=0; g=0; b=255; setColor()" 
                    class="h-10 bg-blue-500 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Blue" :disabled="!on"></button>
            <button @click="r=255; g=255; b=0; setColor()" 
                    class="h-10 bg-yellow-400 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Yellow" :disabled="!on"></button>
            <button @click="r=255; g=0; b=255; setColor()" 
                    class="h-10 bg-pink-500 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Magenta" :disabled="!on"></button>
            <button @click="r=0; g=255; b=255; setColor()" 
                    class="h-10 bg-cyan-400 rounded-lg hover:scale-110 transition-transform shadow-md"
                    title="Cyan" :disabled="!on"></button>
        </div>
    </div>
    
    <script>
        function toggleLight() {
            this.loading = true;
            const action = this.on ? 'off' : 'on';
            
            fetch(`/api/actuator/pi3/BRGB/${action}`, {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                this.on = !this.on;
                this.loading = false;
            })
            .catch(err => {
                this.loading = false;
            });
        }
        
        function setColor() {
            if (!this.on) return;
            
            this.loading = true;
            fetch('/api/rgb/pi3/color', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({r: this.r, g: this.g, b: this.b})
            })
            .then(r => r.json())
            .then(data => {
                this.loading = false;
            })
            .catch(err => {
                this.loading = false;
            });
        }
    </script>
</div>
