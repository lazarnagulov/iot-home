<div x-data="{ 
    time: '07:00', 
    active: false,
    loading: false 
}" x-init="
    fetch('/api/alarm-clock/status')
        .then(r => r.json())
        .then(data => { 
            time = data.time || '07:00'; 
            active = data.active || false; 
        })
        .catch(err => console.error('Failed to load alarm clock status'));
">
    <div class="mb-4">
        <label class="block text-sm font-bold text-gray-700 mb-2">
            <i class="fas fa-clock mr-1"></i> Alarm Time
        </label>
        <input 
            type="time" 
            x-model="time"
            :disabled="active"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent text-lg font-semibold disabled:bg-gray-100 disabled:cursor-not-allowed">
    </div>
    
    <div class="mb-4 p-4 rounded-lg transition-all" 
         :class="active ? 'bg-green-100 border-2 border-green-300' : 'bg-gray-100 border-2 border-gray-300'">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <i class="text-2xl mr-2 transition-colors" 
                   :class="active ? 'fas fa-bell text-green-600' : 'far fa-bell text-gray-400'"></i>
                <div>
                    <p class="font-bold" x-text="active ? 'Alarm Active' : 'Alarm Inactive'"></p>
                    <p class="text-xs text-gray-600" x-show="active">Will ring at <span x-text="time"></span></p>
                </div>
            </div>
            <span x-show="active" class="text-2xl font-bold text-green-600" x-text="time"></span>
        </div>
    </div>
    
    <div class="flex space-x-2">
        <button 
            @click="setAlarm()"
            :disabled="active || loading"
            class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-bell mr-2"></i>
            <span x-text="loading ? 'Setting...' : 'Set Alarm'"></span>
        </button>
        
        <button 
            @click="disableAlarm()"
            :disabled="!active || loading"
            class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-bell-slash mr-2"></i>
            <span x-text="loading ? 'Disabling...' : 'Disable'"></span>
        </button>
    </div>
    
    <p class="text-xs text-gray-500 mt-3 text-center">
        <i class="fas fa-info-circle mr-1"></i>
        Alarm will trigger buzzer and blink display
    </p>
    
    <script>
        function setAlarm() {
            this.loading = true;
            fetch('/api/alarm-clock/set', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({time: this.time})
            })
            .then(r => r.json())
            .then(data => {
                this.active = true;
                this.loading = false;
            })
            .catch(err => {
                this.loading = false;
            });
        }
        
        function disableAlarm() {
            this.loading = true;
            fetch('/api/alarm-clock/disable', {method: 'POST'})
            .then(r => r.json())
            .then(() => {
                this.active = false;
                this.loading = false;
            })
            .catch(err => {
                this.loading = false;
            });
        }
    </script>
</div>
