<div x-data="{ 
    pin: '', 
    message: '', 
    messageType: 'info', 
    showMessage: false,
    systemState: 'DISARMED', // DISARMED, ARMED, TRIGGERED
    loading: false,
    initialized: false,
    arming: false,

    init() {
        if (this.initialized) return;
        this.initialized = true;
        this.fetchStatus();
        setInterval(() => this.fetchStatus(), 2000);
    },

    fetchStatus() {
        fetch('/api/v1/alarm/state')
            .then(r => r.json())
            .then(data => {
                this.systemState = data.state; 
                if (this.systemState === 'ARMED' && this.arming) {
                    this.arming = false;
                }
            })
            .catch(console.error);
    },

    addPin(digit) {
        if (this.pin.length < 4) this.pin += digit;
    },

    clearPin() {
        this.pin = '';
    },

    notify(msg, type = 'info') {
        this.message = msg;
        this.messageType = type;
        this.showMessage = true;
        setTimeout(() => this.showMessage = false, 3000);
    },

    handleAction(action) {
        if (this.pin.length !== 4) {
            this.notify('Enter 4-digit PIN', 'error');
            return;
        }
        if (this.loading) return;

        this.loading = true;
        let endpoint;
        if (action === 'arm') {
            endpoint = '/api/v1/security/activate';
        } else if (action === 'trigger') {
            endpoint = '/api/v1/alarm/trigger';
        } else {
            endpoint = '/api/v1/security/deactivate';
        }

        fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ pin: this.pin })
        })
        .then(r => r.json())
        .then(data => {
            if(data.success || data.valid) {
                let message = data.message;
                if (!message) {
                    if (action === 'arm') {
                        message = 'System Arming in 10 seconds...';
                    } else if (action === 'disarm') {
                        message = 'System Disarmed';
                    } else if (action === 'trigger') {
                        message = 'Alarm Triggered!';
                    }
                }
                if (action === 'arm')
                    this.arming = true;
                this.notify(message, 'success');
                this.pin = '';
                this.fetchStatus();
            } else {
                this.notify(data.error || 'Invalid PIN', 'error');
                this.pin = '';
            }
        })
        .catch(() => this.notify('Connection Error', 'error'))
        .finally(() => this.loading = false);
    }

}" x-init="init()">

    <div class="mb-6 p-4 rounded-lg border-2 text-center transition-all duration-500"
         :class="{
            'bg-green-100 border-green-400 text-green-800': systemState === 'DISARMED',
            'bg-yellow-100 border-yellow-400 text-yellow-800': systemState === 'ARMED',
            'bg-red-100 border-red-500 text-red-800 animate-[pulse_1.2s_linear_infinite]': systemState === 'TRIGGERED',
            'animate-[pulse_2s_linear_infinite]': arming
         }">
        
        <div class="flex items-center justify-center space-x-3">
            <i class="fas text-3xl"
               :class="{
                   'fa-unlock': systemState === 'DISARMED',
                   'fa-lock': systemState === 'ARMED',
                   'fa-exclamation-triangle': systemState === 'TRIGGERED'
               }"></i>
            <div class="text-left">
                <h3 class="font-black text-xl tracking-widest uppercase" x-text="systemState"></h3>
                <p class="text-xs font-semibold opacity-75">
                    <span x-show="systemState === 'DISARMED'">Security System Not Active</span>
                    <span x-show="systemState === 'ARMED'">Security System Active</span>
                    <span x-show="systemState === 'TRIGGERED'">INTRUSION DETECTED</span>
                </p>
            </div>
        </div>
    </div>

    <div class="mb-4">
        <div class="bg-gray-800 text-white p-4 rounded-lg text-center font-mono text-3xl tracking-widest border-2 border-gray-600 h-20 flex items-center justify-center">
            <span x-text="pin.length ? '*'.repeat(pin.length) : '____'"></span>
        </div>
    </div>
    
    <div class="grid grid-cols-3 gap-2 mb-6">
        <template x-for="n in [1,2,3,4,5,6,7,8,9]">
            <button 
                @click="addPin(n)"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 rounded-lg transition-all hover:scale-105 active:scale-95 shadow-md"
                x-text="n">
            </button>
        </template>
        
        <button 
            @click="clearPin()"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-lg transition-all hover:scale-105 active:scale-95 shadow-md">
            <i class="fas fa-backspace"></i>
        </button>
        
        <button 
            @click="addPin('0')"
            class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 rounded-lg transition-all hover:scale-105 active:scale-95 shadow-md">
            0
        </button>
        
        <button 
            @click="systemState === 'DISARMED' ? handleAction('arm') : handleAction('disarm')"
            class="text-white font-bold py-4 rounded-lg transition-all hover:scale-105 active:scale-95 shadow-md"
            :class="systemState === 'DISARMED' ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-500 hover:bg-green-600'">
            <i class="fas" :class="systemState === 'DISARMED' ? 'fa-lock' : 'fa-unlock'"></i>
        </button>
    </div>
    
    <div x-show="showMessage" 
         x-transition.opacity.duration.300ms
         class="mb-4 p-3 rounded-lg text-center font-bold shadow-sm"
         :class="{
            'bg-green-100 text-green-800 border border-green-300': messageType === 'success',
            'bg-red-100 text-red-800 border border-red-300': messageType === 'error',
            'bg-blue-100 text-blue-800 border border-blue-300': messageType === 'info'
         }">
        <p x-text="message"></p>
    </div>
    
    <div class="space-y-2">
        <button 
            x-show="systemState === 'DISARMED'"
            @click="handleAction('arm')"
            :disabled="loading || arming"
            class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-lg">
            <i class="fas fa-shield-alt mr-2"></i>
            Activate Security
        </button>
        
        <button 
            x-show="systemState !== 'DISARMED'"
            @click="handleAction('disarm')"
            :disabled="loading"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-lg">
            <i class="fas fa-lock-open mr-2"></i>
            Deactivate System
        </button>
    </div>

    <div class="pt-2" x-show="systemState === 'ARMED'">
        <button
            @click="handleAction('trigger')"
            :disabled="loading"
            class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-lg">
            <i class="fas fa-bell mr-2"></i>
            Trigger Alarm
        </button>
    </div>
</div>
