<div x-data="{ 
    pin: '', 
    status: '', 
    statusType: 'info',
    showStatus: false 
}">
    <div class="mb-4">
        <div class="bg-gray-800 text-white p-4 rounded-lg text-center font-mono text-3xl tracking-widest">
            <span x-text="'*'.repeat(pin.length) + '_'.repeat(4 - pin.length)"></span>
        </div>
    </div>
    
    <div class="grid grid-cols-3 gap-2 mb-4">
        <template x-for="n in [1,2,3,4,5,6,7,8,9]">
            <button 
                @click="if (pin.length < 4) pin += n"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 rounded-lg transition-all hover:scale-105 active:scale-95"
                x-text="n">
            </button>
        </template>
        <button 
            @click="pin = ''"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-lg transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-backspace"></i>
        </button>
        <button 
            @click="if (pin.length < 4) pin += '0'"
            class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 rounded-lg transition-all hover:scale-105 active:scale-95">
            0
        </button>
        <button 
            @click="submitPin()"
            class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-lg transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-check"></i>
        </button>
    </div>
    
    <!-- Status Message -->
    <div x-show="showStatus" 
         x-transition
         class="mb-4 p-3 rounded-lg"
         :class="{
            'bg-green-100 text-green-800 border border-green-300': statusType === 'success',
            'bg-red-100 text-red-800 border border-red-300': statusType === 'error',
            'bg-blue-100 text-blue-800 border border-blue-300': statusType === 'info'
         }">
        <p class="font-semibold flex items-center">
            <i class="fas mr-2" :class="{
                'fa-check-circle': statusType === 'success',
                'fa-exclamation-circle': statusType === 'error',
                'fa-info-circle': statusType === 'info'
            }"></i>
            <span x-text="status"></span>
        </p>
    </div>
    
    <div class="space-y-2">
        <button 
            @click="activateSecurity()"
            class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-shield-alt mr-2"></i>
            Activate Security System
        </button>
        
        <button 
            @click="deactivateAlarm()"
            class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i class="fas fa-bell-slash mr-2"></i>
            Deactivate Alarm
        </button>
    </div>
    
    <script>
        function submitPin() {
            if (this.pin.length !== 4) {
                this.status = 'Please enter 4 digits';
                this.statusType = 'error';
                this.showStatus = true;
                setTimeout(() => this.showStatus = false, 3000);
                return;
            }
            
            fetch('/api/security/validate-pin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({pin: this.pin})
            })
            .then(r => r.json())
            .then(data => {
                this.status = data.message || (data.valid ? 'PIN Correct!' : 'Invalid PIN');
                this.statusType = data.valid ? 'success' : 'error';
                this.showStatus = true;
                this.pin = '';
                setTimeout(() => this.showStatus = false, 3000);
                
                htmx.trigger('#system-status-banner', 'load');
            })
            .catch(err => {
                this.status = 'Connection error';
                this.statusType = 'error';
                this.showStatus = true;
                setTimeout(() => this.showStatus = false, 3000);
            });
        }
        
        function activateSecurity() {
            if (this.pin.length !== 4) {
                this.status = 'Enter 4-digit PIN first';
                this.statusType = 'error';
                this.showStatus = true;
                setTimeout(() => this.showStatus = false, 3000);
                return;
            }
            
            fetch('/api/security/activate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({pin: this.pin})
            })
            .then(r => r.json())
            .then(data => {
                this.status = data.message || 'Security system activating in 10 seconds...';
                this.statusType = 'success';
                this.showStatus = true;
                this.pin = '';
                htmx.trigger('#system-status-banner', 'load');
            })
            .catch(err => {
                this.status = 'Activation failed';
                this.statusType = 'error';
                this.showStatus = true;
            });
        }
        
        function deactivateAlarm() {
            fetch('/api/alarm/deactivate', {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                this.status = 'Alarm deactivated!';
                this.statusType = 'success';
                this.showStatus = true;
                setTimeout(() => this.showStatus = false, 3000);
                htmx.trigger('#system-status-banner', 'load');
            })
            .catch(err => {
                this.status = 'Deactivation failed';
                this.statusType = 'error';
                this.showStatus = true;
            });
        }
    </script>
</div>
