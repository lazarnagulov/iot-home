<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
    <div class="flex items-center space-x-3">
        <i class="fas {{ 'fa-volume-up' if toggle else 'fa-volume-mute' }} text-2xl {{ 'text-red-500' if toggle else 'text-gray-400' }}"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ name }}</p>
            <p class="text-xs text-gray-500">{{ actuator_id }}</p>
            <p class="text-xs font-medium {{ 'text-yellow-600' if is_simulated else 'text-blue-600' }}">
                {{ 'Simulated' if is_simulated else 'Real Device' }}
            </p>
        </div>
    </div>
    <div class="text-right">
        <span class="px-3 py-1 rounded-full text-sm font-semibold {{ 'bg-red-100 text-red-800' if toggle else 'bg-gray-100 text-gray-600' }}">
            <i class="fas {{ 'fa-bell' if toggle else 'fa-bell-slash' }} mr-1"></i>
            {{ 'Active' if toggle else 'Silent' }}
        </span>
    </div>
</div>
