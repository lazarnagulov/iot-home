<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
    <div class="flex items-center space-x-3">
        <i class="fas fa-compass text-2xl text-indigo-500"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ name }}</p>
            <p class="text-xs text-gray-500">{{ sensor_id }}</p>
            <p class="text-xs font-medium {{ 'text-yellow-600' if is_simulated else 'text-blue-600' }}">
                {{ 'Simulated' if is_simulated else 'Real Sensor' }}
            </p>
        </div>
    </div>

    <div class="text-right space-y-1">
        <div>
            <p class="text-xs text-gray-500">Acceleration</p>
            <p class="text-sm font-semibold text-gray-800">
                X: {{ value.accel_x }} ·
                Y: {{ value.accel_y }} ·
                Z: {{ value.accel_z }}
            </p>
        </div>

        <div>
            <p class="text-xs text-gray-500">Gyroscope</p>
            <p class="text-sm font-semibold text-gray-800">
                X: {{ value.gyro_x }} ·
                Y: {{ value.gyro_y }} ·
                Z: {{ value.gyro_z }}
            </p>
        </div>
    </div>
</div>
