<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
    <div class="flex items-center space-x-3">
        <i class="fas fa-hand-pointer text-2xl {{ 'text-blue-500' if pressed else 'text-gray-400' }}"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ name }}</p>
            <p class="text-xs text-gray-500">{{ sensor_id }} - {{ device_id }}</p>
            <p class="text-xs font-medium {{ 'text-yellow-600' if is_simulated else 'text-blue-600' }}">
                {{ 'Simulated' if is_simulated else 'Real Sensor' }}
            </p>
        </div>
    </div>
    <div class="text-right">
        <span class="px-3 py-1 rounded-full text-sm font-semibold {{ 'bg-blue-100 text-blue-800' if pressed else 'bg-gray-100 text-gray-600' }}">
            <i class="fas {{ 'fa-check-circle' if pressed else 'fa-circle' }} mr-1"></i>
            {{ 'Pressed' if pressed else 'Not Pressed' }}
        </span>
    </div>
</div>
