<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
    <div class="flex items-center space-x-3">
        <i class="fas fa-running text-2xl {{ 'text-orange-500' if motion_detected else 'text-gray-400' }}"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ name }}</p>
            <p class="text-xs text-gray-500">{{ sensor_id }}</p>
            <p class="text-xs font-medium {{ 'text-yellow-600' if is_simulated else 'text-blue-600' }}">
                {{ 'Simulated' if is_simulated else 'Real Sensor' }}
            </p>
        </div>
    </div>
    <div class="text-right">
        <span class="px-3 py-1 rounded-full text-sm font-semibold {{ 'bg-orange-100 text-orange-800' if motion_detected else 'bg-gray-100 text-gray-600' }}">
            <i class="fas {{ 'fa-walking' if motion_detected else 'fa-ban' }} mr-1"></i>
            {{ 'Motion Detected' if motion_detected else 'No Motion' }}
        </span>
    </div>
</div>
