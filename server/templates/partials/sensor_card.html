<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 hover:shadow-md transition-shadow">
    <div class="flex items-center space-x-3">
        <i class="fas {{ icon }} text-2xl {{ icon_color }}"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ display_name }}</p>
            <p class="text-xs font-medium {{ status_color }}">
                {{ status_text }}
            </p>
        </div>
    </div>
    <div class="text-right">
        {{ value_display | safe }}
    </div>
</div>
