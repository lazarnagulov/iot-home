<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
    <div class="flex items-center space-x-3">
        <i class="fas {{ 'fa-door-closed' if value == 'closed' else 'fa-door-open' }} text-2xl {{ 'text-green-500' if value == 'closed' else 'text-red-500' }}"></i>
        <div>
            <p class="font-semibold text-gray-800">{{ name }}</p>
            <p class="text-xs text-gray-500">{{ sensor_id }}</p>
            <p class="text-xs font-medium {{ 'text-yellow-600' if is_simulated else 'text-blue-600' }}">
                {{ 'Simulated' if is_simulated else 'Real Sensor' }}
            </p>
        </div>
    </div>
    <div class="text-right">
        <span class="px-3 py-1 rounded-full text-sm font-semibold {{ 'bg-green-100 text-green-800' if value == 'closed' else 'bg-red-100 text-red-800' }}">
            <i class="fas {{ 'fa-lock' if value == 'closed' else 'fa-lock-open' }} mr-1"></i>
            {{ 'Closed' if value == 'closed' else 'Open' }}
        </span>
    </div>
</div>
